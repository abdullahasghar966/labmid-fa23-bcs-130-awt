# Infra diagram: React/Node -> Nginx -> Authentication -> APIs -> Data storage
# Nginx serves the built React app and reverse-proxies /api to the Node API.

upstream lab_api {
    server api:4000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Caching plan (layer 4): hashed JS/CSS never change -> cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API (auth is checked by the API using the Google token)
    location /api/ {
        proxy_pass http://lab_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # React single-page app; index.html is always revalidated
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
